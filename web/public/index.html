<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capteurs IoT – Cassandra</title>
<style>
:root{--bg:#eef2f4;--panel:#fff;--ink:#14232b;--mute:#5d707a;--line:#d5dde1;--up:#1b8a5a;--down:#c42b38;--accent:#2b50d6;--wash:#fdeaec}
@media (prefers-color-scheme:dark){:root{--bg:#0f171b;--panel:#172228;--ink:#e6eef1;--mute:#93a6af;--line:#2a3a42;--up:#3fc58a;--down:#ff6b76;--accent:#8aa5ff;--wash:#3a1a1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.5rem;padding:1.25rem 1.5rem .5rem}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}
h2{font-size:1rem;margin:0 0 .75rem}
.mute{color:var(--mute);font-size:.85rem}
#alert{margin:.5rem 1.5rem;padding:.9rem 1.1rem;border-radius:8px;background:var(--wash);border:2px solid var(--down);color:var(--ink)}
#alert[hidden]{display:none}
#alert strong{color:var(--down)}
main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:1rem;padding:1rem 1.5rem 2rem}
@media (max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:1rem}
.nodes{display:grid;gap:.5rem}
.node{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-left:5px solid var(--up);border-radius:6px;padding:.55rem .75rem}
.node.down{border-left-color:var(--down);background:var(--wash)}
.node b{display:block}
.state{font-weight:600;color:var(--up)}
.down .state{color:var(--down)}
.log{margin:.75rem 0 0;padding:0;list-style:none;font-size:.85rem}
.log li{padding:.15rem 0;color:var(--mute)}
.sensor{display:flex;justify-content:space-between;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:.55rem .75rem;margin-bottom:.5rem;cursor:pointer}
.sensor[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.sensor:focus-visible,.node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sensor .v{font-size:1.15rem;font-weight:600}
svg{width:100%;height:auto;display:block}
.axis{fill:var(--mute);font-size:11px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mute);font-size:.85rem}
.empty{color:var(--mute);padding:1rem 0}
</style>
</head>
<body>
<header>
  <h1>Mesures des capteurs</h1>
  <span class="mute" id="stamp">Connexion…</span>
</header>
<div id="alert" role="alert" hidden></div>
<main>
  <div>
    <section aria-labelledby="t-nodes">
      <h2 id="t-nodes">Nœuds Cassandra</h2>
      <div class="nodes" id="nodes"></div>
      <ul class="log" id="log"></ul>
    </section>
    <section aria-labelledby="t-sensors">
      <h2 id="t-sensors">Capteurs</h2>
      <div id="sensors"><p class="empty">Connexion à Cassandra…</p></div>
    </section>
  </div>
  <div>
    <section aria-labelledby="t-chart">
      <h2 id="t-chart">Température – <span id="sel">…</span></h2>
      <div id="chart"><p class="empty">Aucune donnée pour le moment.</p></div>
    </section>
    <section aria-labelledby="t-last">
      <h2 id="t-last">Dernières mesures</h2>
      <table><thead><tr><th>Heure</th><th>Température</th></tr></thead><tbody id="rows"></tbody></table>
    </section>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hour = (d) => new Date(d).toLocaleTimeString('fr-FR');
const deg = (v) => v.toFixed(1).replace('.', ',') + ' °C';
const api = async (p) => { const r = await fetch(p); if (!r.ok) throw new Error(r.status); return r.json(); };
let selected = null, prevUp = {}, events = [];

async function refreshNodes() {
  let nodes;
  try { nodes = await api('/api/nodes'); }
  catch { showAlert('<strong>Serveur injoignable.</strong> Le tableau de bord ne reçoit plus d’informations.'); return; }
  nodes.forEach((n) => {
    if (n.name in prevUp && prevUp[n.name] !== n.up) events.unshift({ t: new Date(), name: n.name, up: n.up });
    prevUp[n.name] = n.up;
  });
  $('#nodes').innerHTML = nodes.map((n) => `<div class="node ${n.up ? '' : 'down'}" tabindex="0">
    <span><b>${esc(n.name)}</b><span class="mute">${esc(n.datacenter)} / ${esc(n.rack)}</span></span>
    <span class="state">${n.up ? 'En ligne' : 'Hors ligne'}</span></div>`).join('');
  $('#log').innerHTML = events.slice(0, 5).map((e) =>
    `<li>${hour(e.t)} : ${esc(e.name)} ${e.up ? 'est revenu en ligne' : 'est tombé'}</li>`).join('');
  const down = nodes.filter((n) => !n.up), alive = nodes.length - down.length;
  document.title = (down.length ? '⚠ ' : '') + 'Capteurs IoT – Cassandra';
  if (!down.length) { $('#alert').hidden = true; return; }
  const names = down.map((n) => esc(n.name)).join(', ');
  showAlert(`<strong>${down.length > 1 ? 'Nœuds hors ligne' : 'Nœud hors ligne'} : ${names}.</strong> ` +
    (alive >= 2 ? `Les lectures et écritures en QUORUM fonctionnent encore (${alive} nœuds sur 3). Les lectures en ALL échouent.`
                : `Il ne reste que ${alive} nœud sur 3 : le QUORUM n’est plus possible.`));
}
function showAlert(html) { const a = $('#alert'); a.innerHTML = html; a.hidden = false; }

async function refreshSensors() {
  try {
    const list = await api('/api/sensors');
    if (!list.length) { $('#sensors').innerHTML = '<p class="empty">Aucun capteur n’a encore envoyé de mesure.</p>'; return; }
    if (!selected || !list.some((s) => s.id === selected)) selected = list[0].id;
    $('#sensors').innerHTML = list.map((s) => `<button class="sensor" data-id="${esc(s.id)}" aria-pressed="${s.id === selected}">
      <span><b>${esc(s.id)}</b><br><span class="mute">${s.date ? hour(s.date) : '–'}</span></span>
      <span class="v">${s.valeur != null ? deg(s.valeur) : '–'}</span></button>`).join('');
    $('#stamp').textContent = 'Mis à jour à ' + hour(new Date());
    await refreshMeasures();
  } catch { $('#sensors').innerHTML = '<p class="empty">Cassandra ne répond pas encore. Nouvel essai en cours…</p>'; }
}
$('#sensors').addEventListener('click', (e) => {
  const b = e.target.closest('.sensor'); if (!b) return;
  selected = b.dataset.id; refreshSensors();
});

async function refreshMeasures() {
  $('#sel').textContent = selected;
  const m = await api('/api/measures?limit=40&capteur=' + encodeURIComponent(selected));
  $('#rows').innerHTML = m.slice(-8).reverse().map((r) => `<tr><td>${hour(r.date)}</td><td>${deg(r.valeur)}</td></tr>`).join('');
  if (m.length < 2) { $('#chart').innerHTML = '<p class="empty">Pas assez de mesures pour tracer la courbe.</p>'; return; }
  const W = 720, H = 260, L = 48, R = 14, T = 14, B = 28;
  const vals = m.map((r) => r.valeur), lo = Math.min(...vals) - 0.3, hi = Math.max(...vals) + 0.3;
  const x = (i) => L + (i / (m.length - 1)) * (W - L - R), y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const grid = [0, 1, 2, 3].map((k) => { const v = lo + ((hi - lo) * k) / 3;
    return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(1)}</text>`; }).join('');
  const pts = m.map((r, i) => `${x(i).toFixed(1)},${y(r.valeur).toFixed(1)}`).join(' ');
  $('#chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Température de ${esc(selected)} sur les ${m.length} dernières mesures">
    ${grid}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(m.length - 1)}" cy="${y(vals[vals.length - 1])}" r="4.5" fill="var(--accent)"/>
    <text class="axis" x="${L}" y="${H - 8}">${hour(m[0].date)}</text>
    <text class="axis" x="${W - R}" y="${H - 8}" text-anchor="end">${hour(m[m.length - 1].date)}</text></svg>`;
}

refreshNodes(); refreshSensors();
setInterval(refreshNodes, 3000);
setInterval(refreshSensors, 5000);
</script>
</body>
</html>
